<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.heading }} | AgriGrowth Knowledge Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'DM Sans', sans-serif; background: #fbfaf6; color: #202920; margin: 0; padding: 0; }
        .topbar { background: #183c29; color: white; padding: 16px 5%; display: flex; justify-content: space-between; align-items: center; }
        .topbar b { font-family: 'Manrope', sans-serif; font-size: 18px; color: #e4c980; }
        .back-btn { background: #8f1731; color: white; text-decoration: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; font-size: 13px; }
        .hero-banner { background: #e6eddf; padding: 45px 5%; text-align: center; border-bottom: 1px solid #d8d5c4; }
        .badge-tag { display: inline-block; background: #8f1731; color: #fff; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; padding: 5px 12px; border-radius: 20px; margin-bottom: 14px; }
        h1 { font-family: 'Manrope', sans-serif; font-size: clamp(26px, 4vw, 42px); margin: 0 auto 12px; max-width: 800px; }
        .container { max-width: 820px; margin: 35px auto; padding: 0 20px 60px; }
        .article-img { width: 100%; max-height: 400px; object-fit: cover; border-radius: 12px; margin-bottom: 25px; border: 1px solid #e6e4da; }
        .content-box { background: white; border: 1px solid #e6e4da; border-radius: 10px; padding: 30px; font-size: 16px; line-height: 1.8; box-shadow: 0 10px 30px rgba(0,0,0,0.03); }
    </style>
</head>
<body>
    <div class="topbar">
        <b>🌱 AgriGrowth Knowledge Hub</b>
        <a href="/#knowledge-hub" class="back-btn">← Back to Website</a>
    </div>
    <div class="hero-banner">
        <span class="badge-tag">{{ article.category }} • ARTICLE {{ article.card_number }}</span>
        <h1>{{ article.heading }}</h1>
        <p style="max-width: 680px; margin: 0 auto; color: #49534a;">{{ article.short_description }}</p>
    </div>
    <div class="container">
        {% if article.image %}
            <img src="{{ article.image.url }}" alt="{{ article.heading }}" class="article-img">
        {% endif %}
        <div class="content-box">
            {{ article.inner_text|linebreaks }}
        </div>
    </div>
</body>
</html>
